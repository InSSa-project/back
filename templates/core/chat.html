{% extends 'core/base.html' %}
{% block content %}
<style>
    .chat-shell {
        max-width: 860px;
        margin: 24px auto;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        font-family: Arial, sans-serif;
    }
    .chat-log {
        min-height: 360px;
        max-height: 560px;
        overflow-y: auto;
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 12px;
        background: #fafafa;
    }
    .message {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        white-space: pre-wrap;
        line-height: 1.5;
    }
    .message.user {
        background: #e8f1ff;
        margin-left: 15%;
    }
    .message.assistant {
        background: #fff;
        margin-right: 15%;
        border: 1px solid #eee;
    }
    .message.error {
        background: #ffecec;
        color: #9b1c1c;
    }
    .chat-form {
        display: grid;
        grid-template-columns: 1fr 96px;
        gap: 8px;
        margin-top: 12px;
        align-items: stretch;
    }
    .chat-form textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 96px;
        resize: vertical;
        padding: 12px;
        border: 2px solid #1f6feb;
        border-radius: 8px;
        background: #fff;
        color: #111;
        font-size: 16px;
        line-height: 1.5;
    }
    .chat-form button {
        width: 96px;
        border: 0;
        border-radius: 8px;
        background: #1f6feb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }
    .chat-label {
        display: block;
        margin-top: 14px;
        margin-bottom: 6px;
        font-weight: 700;
    }
    @media (max-width: 640px) {
        .chat-form {
            grid-template-columns: 1fr;
        }
        .chat-form button {
            width: 100%;
            min-height: 44px;
        }
    }
    .references {
        margin-top: 8px;
        font-size: 13px;
        color: #555;
    }
</style>

<div class="chat-shell">
    <h1>INSSA AI 챗봇</h1>
    <p>React UI 붙이기 전, 백엔드 API 확인용 임시 HTML 화면입니다.</p>

    <div id="chatLog" class="chat-log">
        <div class="message assistant">안녕하세요. SSAFY 일정, 공지, 시험, 규정 관련해서 물어보세요.</div>
    </div>

    <label class="chat-label" for="messageInput">메시지 입력</label>
    <form id="chatForm" class="chat-form">
        {% csrf_token %}
        <textarea id="messageInput" name="message" rows="4" placeholder="예: 이번 주 시험 일정 알려줘"></textarea>
        <button type="submit">전송</button>
    </form>
</div>

<script>
    const chatLog = document.getElementById('chatLog');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) {
            return parts.pop().split(';').shift();
        }
        return '';
    }

    function appendMessage(role, content, references = []) {
        const item = document.createElement('div');
        item.className = `message ${role}`;
        item.textContent = content;

        if (references.length > 0) {
            const refs = document.createElement('div');
            refs.className = 'references';
            refs.textContent = `참고 문서: ${references.map(ref => ref.title || ref.chunk_id || 'reference').join(', ')}`;
            item.appendChild(refs);
        }

        chatLog.appendChild(item);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = messageInput.value.trim();
        if (!message) {
            return;
        }

        appendMessage('user', message);
        messageInput.value = '';
        appendMessage('assistant', '답변 생성 중...');
        const loadingMessage = chatLog.lastElementChild;

        try {
            const response = await fetch('/api/v1/ai/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                credentials: 'same-origin',
                body: JSON.stringify({ message }),
            });
            const payload = await response.json();
            loadingMessage.remove();

            if (!response.ok || payload.status !== 'success') {
                appendMessage('error', payload.message || '요청 처리 중 오류가 발생했습니다.');
                return;
            }

            const data = payload.data || {};
            appendMessage('assistant', data.answer || '(빈 응답)', data.references || []);
        } catch (error) {
            loadingMessage.remove();
            appendMessage('error', `네트워크 오류: ${error.message}`);
        }
    });
</script>
{% endblock %}
