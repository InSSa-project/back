{% extends 'core/base.html' %}
{% block content %}
<h1>저장된 크롤링 데이터</h1>
<ul>
    {% for item in items %}
        <li><a href="{% url 'crawl_data_detail' item.pk %}">{{ item.title }}</a> - {{ item.source_url }}</li>
    {% empty %}
        <li>저장된 데이터가 없습니다.</li>
    {% endfor %}
</ul>
{% endblock %}
