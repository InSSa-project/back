{% extends 'core/base.html' %}
{% block content %}
<h1>로그인</h1>
{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <label>아이디 또는 이메일: <input type="text" name="username"></label><br>
    <label>비밀번호: <input type="password" name="password"></label><br>
    <button type="submit">로그인</button>
</form>

<hr>

<h2>소셜 로그인</h2>
<p>
    <a href="{% url 'users-oauth-authorize' provider='google' %}">
        <button type="button">Google로 로그인</button>
    </a>
</p>
<p>
    <a href="{% url 'users-oauth-authorize' provider='kakao' %}">
        <button type="button">Kakao로 로그인</button>
    </a>
</p>
{% endblock %}
