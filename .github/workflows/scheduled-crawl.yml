name: Scheduled SSAFY Crawl

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: scheduled-ssafy-crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    name: Run scheduled_ssafy_crawl
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_REQUIRE: ${{ secrets.DATABASE_SSL_REQUIRE }}
      DB_ENGINE: ${{ secrets.DB_ENGINE }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_CONN_MAX_AGE: ${{ secrets.DB_CONN_MAX_AGE }}
      SSAFY_ID: ${{ secrets.SSAFY_ID }}
      SSAFY_PASSWORD: ${{ secrets.SSAFY_PASSWORD }}
      SSAFY_LOGIN_URL: ${{ secrets.SSAFY_LOGIN_URL }}
      SSAFY_NOTICE_LIST_URL: ${{ secrets.SSAFY_NOTICE_LIST_URL }}
      SSAFY_RULE_LIST_URL: ${{ secrets.SSAFY_RULE_LIST_URL }}
      SSAFY_MENTORING_DATA_LIST_URL: ${{ secrets.SSAFY_MENTORING_DATA_LIST_URL }}
      SSAFY_MENTORING_NOTICE_LIST_URL: ${{ secrets.SSAFY_MENTORING_NOTICE_LIST_URL }}
      SSAFY_MENTORING_QNA_LIST_URL: ${{ secrets.SSAFY_MENTORING_QNA_LIST_URL }}
      SSAFY_CRAWLER_MODE: ssafy_notice
      SSAFY_CRAWLER_SOURCES: notice,academic_rule,mentoring,mentoring_notice,mentoring_qna
      SSAFY_NOTICE_MAX_PAGES: '2'
      SSAFY_CRAWLER_RECENT_LIMIT: '30'
      SSAFY_DETAIL_TIMEOUT: ${{ secrets.SSAFY_DETAIL_TIMEOUT }}
      SSAFY_SOURCE_TIMEOUT: ${{ secrets.SSAFY_SOURCE_TIMEOUT }}
      OCR_PROVIDER: ${{ secrets.OCR_PROVIDER }}
      CLOVA_OCR_INVOKE_URL: ${{ secrets.CLOVA_OCR_INVOKE_URL }}
      CLOVA_OCR_SECRET_KEY: ${{ secrets.CLOVA_OCR_SECRET_KEY }}
      GOOGLE_VISION_ENABLED: ${{ secrets.GOOGLE_VISION_ENABLED }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Set up Google Vision credentials
        if: env.OCR_PROVIDER == 'google_vision'
        env:
          _GOOGLE_VISION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_VISION_CREDENTIALS_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("_GOOGLE_VISION_CREDENTIALS_JSON", "").strip()
          if not raw:
              raise SystemExit(
                  "GOOGLE_VISION_CREDENTIALS_JSON secret is not set or empty. "
                  "Add the service account JSON content as a GitHub Repository Secret named GOOGLE_VISION_CREDENTIALS_JSON."
              )

          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"GOOGLE_VISION_CREDENTIALS_JSON is not valid JSON: {exc}")

          required = {"type", "project_id", "private_key", "client_email"}
          missing = required - payload.keys()
          if missing:
              raise SystemExit(f"GOOGLE_VISION_CREDENTIALS_JSON is missing required fields: {sorted(missing)}")

          target = Path(os.environ["RUNNER_TEMP"]) / "google-vision-credentials.json"
          target.write_text(json.dumps(payload), encoding="utf-8")
          target.chmod(0o600)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"GOOGLE_APPLICATION_CREDENTIALS={target}\n")

          print("ocr_runtime credentials_file_created=true")
          print(f"ocr_runtime credentials_type={payload.get('type', '-')}")
          print(f"ocr_runtime credentials_project_id_present={bool(payload.get('project_id'))}")
          print(f"ocr_runtime credentials_client_email_present={bool(payload.get('client_email'))}")
          PY

      - name: Diagnose OCR environment
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          provider = os.getenv("OCR_PROVIDER", "")
          enabled = os.getenv("GOOGLE_VISION_ENABLED", "")
          credentials = os.getenv("GOOGLE_APPLICATION_CREDENTIALS", "")

          print(f"ocr_runtime provider_present={bool(provider.strip())}")
          print(f"ocr_runtime provider_normalized={provider.strip().lower() or '-'}")
          print(f"ocr_runtime provider_supported={provider.strip().lower() in ('google_vision', 'clova', 'mock')}")
          print(f"ocr_runtime google_vision_enabled_present={bool(enabled.strip())}")
          print(f"ocr_runtime google_vision_enabled={enabled.strip().lower() in ('1', 'true', 'yes', 'on')}")
          print(f"ocr_runtime credentials_path_present={bool(credentials.strip())}")

          if credentials.strip():
              p = Path(credentials.strip())
              file_exists = p.is_file()
              print(f"ocr_runtime credentials_file_exists={file_exists}")
              if file_exists:
                  readable = os.access(str(p), os.R_OK)
                  print(f"ocr_runtime credentials_file_readable={readable}")
                  if readable:
                      try:
                          import json
                          data = json.loads(p.read_text(encoding="utf-8"))
                          required = {"type", "project_id", "private_key", "client_email"}
                          missing = required - data.keys()
                          print(f"ocr_runtime credentials_json_valid=true")
                          print(f"ocr_runtime credentials_required_fields_present={not missing}")
                      except Exception:
                          print(f"ocr_runtime credentials_json_valid=false")
          else:
              print(f"ocr_runtime credentials_file_exists=false")
          PY

      - name: Check crawl environment
        run: python manage.py check_crawl_env

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run scheduled crawl
        run: python manage.py scheduled_ssafy_crawl
